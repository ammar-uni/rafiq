name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run demo
      - run: npm run export:messages
      - run: npm run preview:build
      - run: git diff --exit-code -- examples/
      - name: Build the runtime image without credentials
        run: docker build -t rafiq:check .
      - name: Verify encrypted state across containers without network access
        run: |
          docker volume create rafiq-check-data
          docker run --rm --network none --read-only --tmpfs /tmp:size=16m -v rafiq-check-data:/data -v "$PWD/test/image-smoke.mjs:/app/image-smoke.mjs:ro" rafiq:check node image-smoke.mjs seed
          docker run --rm --network none --read-only --tmpfs /tmp:size=16m -v rafiq-check-data:/data -v "$PWD/test/image-smoke.mjs:/app/image-smoke.mjs:ro" rafiq:check node image-smoke.mjs read
