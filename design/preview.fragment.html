<div id="rafiq-native-preview" dir="rtl" lang="ar" aria-label="تجربة هوية رفيق ورسائله في ديسكورد">
  <style>
    #rafiq-native-preview {
      --rn-bg:light-dark(#fff,#313338); --rn-panel:light-dark(#f8f9fa,#2b2d31);
      --rn-ink:light-dark(#23252a,#f1f2f5); --rn-muted:light-dark(#5f6672,#b5bac5);
      --rn-line:light-dark(#dcdfe4,#44464e); --rn-button:light-dark(#e7e9ed,#45474f);
      --rn-success:light-dark(#248046,#248046); --rn-link:light-dark(#24715a,#90caaa);
      font:16px/1.7 "Segoe UI",Tahoma,Arial,sans-serif; color:var(--rn-ink);
      background:light-dark(#f1f2f4,#202225); border-radius:12px;
      container-type:inline-size; container-name:rafiq;
    }
    #rafiq-native-preview * { box-sizing:border-box; }
    #rafiq-native-preview .rn-window { background:var(--rn-bg); border:1px solid var(--rn-line); border-radius:12px; overflow:hidden; }
    #rafiq-native-preview .rn-top { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; padding:13px 20px; border-bottom:1px solid var(--rn-line); }
    #rafiq-native-preview .rn-channel { font-size:14px; font-weight:500; }
    #rafiq-native-preview .rn-channel::before { content:'#'; margin-inline-end:9px; color:var(--rn-muted); font-size:21px; }
    #rafiq-native-preview .rn-preview-label { font-size:12px; color:var(--rn-muted); }
    #rafiq-native-preview .rn-message { display:grid; grid-template-columns:40px minmax(0,1fr); gap:12px; padding:22px 20px; }
    #rafiq-native-preview .rn-avatar { width:40px; height:40px; border-radius:50%; display:block; object-fit:cover; }
    #rafiq-native-preview .rn-content { min-width:0; }
    #rafiq-native-preview .rn-author { display:flex; align-items:center; flex-wrap:wrap; gap:7px; margin:0 0 12px; }
    #rafiq-native-preview .rn-name { font-size:16px; font-weight:500; }
    #rafiq-native-preview .rn-bot { background:light-dark(#5865f2,#5865f2); color:light-dark(#fff,#fff); padding:0 5px; border-radius:4px; font-size:11px; }
    #rafiq-native-preview .rn-context { font-size:12px; color:var(--rn-muted); }
    #rafiq-native-preview .rn-container { max-width:600px; background:var(--rn-panel); border:1px solid var(--rn-line); border-inline-start:3px solid #65ac89; border-radius:9px; padding:16px; }
    #rafiq-native-preview .rn-gallery { margin:0 0 17px; }
    #rafiq-native-preview .rn-gallery img { width:100%; height:auto; aspect-ratio:3/1; display:block; border-radius:6px; }
    #rafiq-native-preview .rn-text + .rn-text { margin-top:11px; }
    #rafiq-native-preview .rn-text { white-space:normal; overflow-wrap:anywhere; }
    #rafiq-native-preview .rn-section { display:flex; align-items:center; justify-content:space-between; gap:18px; padding:10px 0; }
    #rafiq-native-preview .rn-section .rn-text { flex:1; min-width:0; }
    #rafiq-native-preview .rn-section button { flex-shrink:0; }
    #rafiq-native-preview blockquote { margin:0; padding-inline-start:13px; border-inline-start:3px solid var(--rn-line); font-size:18px; line-height:1.9; }
    #rafiq-native-preview .rn-text h2 { font-size:22px; font-weight:500; line-height:1.6; margin:0 0 7px; }
    #rafiq-native-preview .rn-text h3 { font-size:18px; font-weight:500; line-height:1.7; margin:0 0 10px; }
    #rafiq-native-preview .rn-line { min-height:1.5em; }
    #rafiq-native-preview .rn-small { font-size:12px; color:var(--rn-muted); }
    #rafiq-native-preview .rn-text a { color:var(--rn-link); text-decoration:underline; text-underline-offset:3px; }
    #rafiq-native-preview .rn-rule { border:0; border-top:1px solid var(--rn-line); margin:16px 0 13px; }
    #rafiq-native-preview .rn-row { display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-top:8px; }
    #rafiq-native-preview .rn-row + .rn-row { margin-top:9px; }
    #rafiq-native-preview button { font:500 14px/1.5 "Segoe UI",Tahoma,Arial,sans-serif; min-height:38px; display:inline-flex; align-items:center; justify-content:center; padding:8px 13px; border:1px solid transparent; border-radius:5px; background:var(--rn-button); color:var(--rn-ink); cursor:pointer; transition:filter 120ms; }
    #rafiq-native-preview button:hover { filter:brightness(1.08); }
    #rafiq-native-preview button.rn-positive { color:light-dark(#fff,#fff); background:var(--rn-success); }
    #rafiq-native-preview .rn-select-label { display:block; font-size:13px; color:var(--rn-muted); margin-top:13px; }
    #rafiq-native-preview select { width:100%; min-width:0; margin-top:5px; padding:10px; font:400 16px/1.5 "Segoe UI",Tahoma,Arial,sans-serif; color:var(--rn-ink); background:var(--rn-bg); border:1px solid var(--rn-line); border-radius:5px; }
    #rafiq-native-preview .rn-help { color:var(--rn-muted); font-size:12px; margin-top:5px; }
    #rafiq-native-preview .rn-demo-footer { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; padding:9px 18px; border-top:1px solid var(--rn-line); color:var(--rn-muted); font-size:12px; }
    #rafiq-native-preview .rn-demo-footer button { background:transparent; color:var(--rn-muted); font-size:12px; min-height:30px; padding:4px 0; font-weight:400; }
    #rafiq-native-preview[data-screen="reminder"] .rn-container { max-width:450px; }
    #rafiq-native-preview[data-screen="reminder"] .rn-text:first-child .rn-line { font-size:19px; line-height:1.95; }
    @container rafiq (max-width:450px) {
      #rafiq-native-preview .rn-message { display:block; padding:15px 12px; position:relative; }
      #rafiq-native-preview .rn-avatar { position:absolute; width:32px; height:32px; inset-inline-start:12px; top:14px; }
      #rafiq-native-preview .rn-author { min-height:32px; margin-inline-start:41px; margin-bottom:13px; }
      #rafiq-native-preview .rn-container { padding:13px; }
      #rafiq-native-preview .rn-top { padding:11px 13px; }
      #rafiq-native-preview .rn-text h2 { font-size:20px; }
      #rafiq-native-preview .rn-row button { flex:1 1 auto; }
      #rafiq-native-preview .rn-demo-footer { padding:9px 13px; }
    }
    @media(pointer:coarse) { #rafiq-native-preview button,#rafiq-native-preview select { min-height:44px; } }
    @media(prefers-reduced-motion:reduce) { #rafiq-native-preview button { transition:none; } }
    #rafiq-native-preview .rn-stage { padding:12px 4px 22px; }
    #rafiq-native-preview .rn-kicker { color:var(--rn-link);font-size:12px;letter-spacing:.02em; }
    #rafiq-native-preview h1 { font-size:38px;line-height:1.4;margin:8px 0;font-weight:650; }
    #rafiq-native-preview .rn-stage p { color:var(--rn-muted);margin:0 0 18px; }
    #rafiq-native-preview .rn-scenarios { display:flex;gap:8px;flex-wrap:wrap; }
    #rafiq-native-preview .rn-scenarios button { border:1px solid var(--rn-line);border-radius:20px;background:var(--rn-panel);font-size:13px; }
    #rafiq-native-preview button:focus-visible,#rafiq-native-preview select:focus-visible { outline:3px solid var(--rn-link);outline-offset:3px; }
    #rafiq-native-preview button[disabled] { opacity:.55;cursor:wait; }
    #rafiq-native-preview .rn-container { box-shadow:0 8px 28px #0000000a; }
    #rafiq-native-preview .rn-text strong { font-weight:650; }
    @container rafiq (max-width:450px) { #rafiq-native-preview .rn-section { gap:8px;flex-wrap:wrap; } #rafiq-native-preview .rn-stage { padding:18px 12px; } }
  </style>
  <div class="rn-stage">
    <div class="rn-kicker">رفيق / ٠.٧ · تجربة التصميم</div>
    <h1>خيرٌ يرافقك.</h1>
    <p>اختر مدينتك، وجرّب مواقيت الصلاة، والأذكار، وأفكار الخير.</p>
    <div class="rn-scenarios" aria-label="التنقل في المعاينة">
      <button type="button" data-action="welcome">الترحيب</button>
      <button type="button" data-action="home">مساحتي</button>
      <button type="button" data-action="favorites">محفوظاتي</button>
      <button type="button" data-action="break">المؤقّت</button>
      <button type="button" data-demo="theme" aria-pressed="false">المظهر الفاتح</button>
    </div>
  </div>
  <div class="rn-window">
    <div class="rn-top"><span class="rn-channel" id="rn-channel">رفيق</span><span class="rn-preview-label">معاينة تفاعلية</span></div>
    <div class="rn-message">
      <img class="rn-avatar" src="__AVATAR_WEBP__" alt="أيقونة رفيق" width="40" height="40">
      <div class="rn-content">
        <div class="rn-author"><span class="rn-name">رفيق</span><span class="rn-bot">تطبيق</span><span class="rn-context" id="rn-context">رسالة مثبتة</span></div>
        <div id="rn-view" aria-live="polite" aria-atomic="true"></div>
      </div>
    </div>
    <div class="rn-demo-footer"><span id="rn-simulation">تجربة محلية · لا تُرسل رسائل ولا تُحفظ بيانات</span><button type="button" data-demo="reset">بدء تجربة جديدة ↶</button></div>
  </div>
  <script>
  (() => {
    __MESSAGE_LIBRARY__
    const root=document.getElementById('rafiq-native-preview');
    const view=root.querySelector('#rn-view');
    const banner='__BANNER_WEBP__';
    const store=new PreviewStore();
    const queue={run:(_id,task)=>Promise.resolve().then(task)};
    let simulatedMessages=0, theme=getComputedStyle(root).colorScheme==='light'?'light':'dark', busy=false, currentAction='welcome';
    const demoCities=[{label:'برلين، ألمانيا',latitude:52.524,longitude:13.411,timezone:'Europe/Berlin'},{label:'مكة المكرمة، السعودية',latitude:21.426,longitude:39.826,timezone:'Asia/Riyadh'},{label:'نيويورك، الولايات المتحدة',latitude:40.714,longitude:-74.006,timezone:'America/New_York'}];
    const prayers=new PrayerApp({store,lookup:async()=>demoCities,sendDM:async()=>{simulatedMessages++;}});
    const app=new RafiqApp({store,queue,prayers,sendDM:async()=>{simulatedMessages++;}});
    const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const markdown=value=>value.split('\n').map(line=>{
      const safe=escapeHtml(line).replace(/\[([^\]]+)\]\((https:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/&lt;t:(\d+):R&gt;/g,(_,seconds)=>{const minutes=Math.ceil((Number(seconds)*1000-Date.now())/60000);return minutes>0?'بعد نحو '+minutes.toLocaleString('ar')+' دقيقة':'حان الموعد';});
      if(safe.startsWith('### '))return '<h3>'+safe.slice(4)+'</h3>';
      if(safe.startsWith('## '))return '<h2>'+safe.slice(3)+'</h2>';
      if(safe.startsWith('-# '))return '<div class="rn-small">'+safe.slice(3)+'</div>';
      if(safe.startsWith('&gt; '))return '<blockquote>'+safe.slice(5)+'</blockquote>';
      return '<div class="rn-line">'+safe+'</div>';
    }).join('');
    function component(item) {
      if(item.type===17)return '<div class="rn-container" style="border-inline-start-color:#'+item.accent_color.toString(16).padStart(6,'0')+'">'+item.components.map(component).join('')+'</div>';
      if(item.type===9)return '<div class="rn-section"><div>'+item.components.map(component).join('')+'</div>'+component(item.accessory)+'</div>';
      if(item.type===10)return '<div class="rn-text">'+markdown(item.content)+'</div>';
      if(item.type===12)return '<figure class="rn-gallery"><img src="'+banner+'" alt="'+escapeHtml(item.items[0].description)+'" width="1536" height="512"></figure>';
      if(item.type===14)return '<hr class="rn-rule">';
      if(item.type===1)return '<div class="rn-row">'+item.components.map(component).join('')+'</div>';
      if(item.type===2){
        if(item.style===5)return '<a href="'+escapeHtml(item.url)+'" target="_blank" rel="noopener noreferrer">'+escapeHtml(item.label)+'</a>';
        return '<button type="button" '+(item.disabled?'disabled ':'')+'data-action="'+item.custom_id.slice(9)+'" class="'+(item.style===3?'rn-positive':'')+'">'+escapeHtml(item.label)+'</button>';
      }
      if(item.type===3){
        const key=item.custom_id.slice(9), selected=item.options.find(option=>option.default)||item.options[0];
        return '<div style="width:100%"><label class="rn-select-label" for="rn-'+key+'">'+escapeHtml(item.placeholder)+'</label><select id="rn-'+key+'" data-preference="'+key+'" aria-describedby="rn-'+key+'-help">'+(!item.options.some(option=>option.default)?'<option disabled selected value="">اختر نتيجة</option>':'')+item.options.map(option=>'<option value="'+escapeHtml(option.value)+'" '+(option.default?'selected':'')+'>'+escapeHtml(option.label)+'</option>').join('')+'</select><div class="rn-help" id="rn-'+key+'-help">'+escapeHtml(selected.description||'')+'</div></div>';
      }
      return '';
    }
    function render(payload, focus) {
      root.dataset.screen=currentAction;
      root.style.setProperty('color-scheme',theme);
      const themeButton=root.querySelector('[data-demo="theme"]');
      themeButton.textContent=theme==='dark'?'المظهر الفاتح':'المظهر الداكن';
      themeButton.setAttribute('aria-pressed',String(theme==='light'));
      root.querySelector('#rn-context').textContent=currentAction==='welcome'?'بطاقة الترحيب':'يظهر لك وحدك';
      view.innerHTML=payload.components.map(component).join('');
      root.querySelector('#rn-simulation').textContent='تجربة محلية · لا تُرسل رسائل ولا تُحفظ بيانات'+(simulatedMessages?' · جُرّب إرسال الخاص محليًا':'');
      if(focus)view.querySelector('button,select')?.focus({preventScroll:true});
    }
    let payload=welcomePayload();
    async function navigate(action, values=[], focus=true) {
      if(busy)return;
      if(['prayer_city_modal','prayer_adjust_modal'].includes(action)) {
        const modal=prayerModal(action,store.getPrayer());
        view.innerHTML='<div class="rn-container"><h2>'+escapeHtml(modal.title)+'</h2>'+(action==='prayer_city_modal'?'<p>المعاينة تستخدم ثلاث مدن تجريبية فقط، ولا تتصل بخدمة البحث.</p>':'')+'<form id="rn-prayer-form">'+modal.components.map(row=>{const f=row.component;return '<label style="display:block;margin:16px 0">'+escapeHtml(row.label)+'<input style="display:block;width:100%;box-sizing:border-box;padding:12px;margin-top:8px;background:transparent;color:inherit;border:1px solid #8aaec4;border-radius:8px" name="'+f.custom_id+'" value="'+escapeHtml(f.value||'')+'" placeholder="'+escapeHtml(f.placeholder)+'" maxlength="'+f.max_length+'" required></label>';}).join('')+'<button type="submit" class="rn-positive">'+(action==='prayer_city_modal'?'ابحث':'احفظ التعديل')+'</button> <button type="button" data-action="prayer">رجوع</button></form></div>';
        view.querySelector('input').focus();
        view.querySelector('form').addEventListener('submit',event=>{event.preventDefault();const data=new FormData(event.target);void navigate(modal.custom_id.slice(9),modal.components.map(row=>data.get(row.component.custom_id)));});
        return;
      }
      busy=true;view.setAttribute('aria-busy','true');
      try{
        currentAction=action;
        payload=action==='welcome'?welcomePayload():await app.handle({userId:'1',guildId:'10',action,values});
        render(payload,focus);
      }catch{
        payload=noticePayload('تعذّر عرض المعاينة','ابدأ تجربة جديدة ثم حاول مرة أخرى.');
        render(payload,focus);
      }finally{busy=false;view.removeAttribute('aria-busy');}
    }
    root.addEventListener('click',event=>{
      const target=event.target.closest('button');if(!target||!root.contains(target))return;
      if(target.dataset.demo==='theme'){theme=theme==='dark'?'light':'dark';target.textContent=theme==='dark'?'المظهر الفاتح':'المظهر الداكن';target.setAttribute('aria-pressed',String(theme==='light'));render(payload,false);return;}
      if(target.dataset.demo==='reset'){store.reset();prayers.forget('1');simulatedMessages=0;void navigate('welcome');return;}
      if(target.dataset.action)void navigate(target.dataset.action);
    });
    root.addEventListener('change',async event=>{
      const key=event.target.dataset.preference;
      if(!key)return;
      await navigate(key,[event.target.value],false);
      root.querySelector('[data-preference="'+key+'"]')?.focus({preventScroll:true});
    });
    render(payload,false);
  })();
  </script>
</div>
