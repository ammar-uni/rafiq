services:
  rafiq:
    build: .
    init: true
    restart: "on-failure:5"
    stop_grace_period: 30s
    env_file: .env
    environment:
      RAFIQ_DATABASE_PATH: /data/rafiq.enc
      RAFIQ_STATUS_PATH: /tmp/rafiq-status.json
    volumes:
      - rafiq-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m

volumes:
  rafiq-data:
